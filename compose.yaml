services:
  api:
    build: .
    ports:
      # Windows can reserve port ranges (Hyper-V, WSL): set API_PORT in a local .env to use another host port.
      - "${API_PORT:-8080}:8080"
    environment:
      # Empty unless set in the shell or in .env: the service then seeds its default accounts.
      SEED_ACCOUNTS: ${SEED_ACCOUNTS:-}
      ENV_CONFIG_URL: ${ENV_CONFIG_URL:-https://env.hivenet.com/dev}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Longer than the service's 10 s shutdown timeout, so Docker does not kill it while requests finish.
    stop_grace_period: 15s

  test:
    profiles: ["test"]
    image: golang:1.27@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    working_dir: /src
    environment:
      # The race detector needs cgo.
      CGO_ENABLED: "1"
    volumes:
      - .:/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    command:
      - sh
      - -c
      - >-
        go vet ./...
        && go test -race -coverpkg=./internal/... -coverprofile=/tmp/coverage.out ./...
        && sh scripts/check-coverage.sh /tmp/coverage.out

  demo:
    profiles: ["demo"]
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/demo.sh"]

  docs:
    profiles: ["docs"]
    image: swaggerapi/swagger-ui:v5.34.1@sha256:59ee9021a8884437c7fd8aae79e0a46ee6b6dd3afd7f24a587c4501585fde53b
    ports:
      - "${DOCS_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /api/openapi.yaml
    volumes:
      - ./api:/api:ro

  openapi-lint:
    profiles: ["lint"]
    image: redocly/cli:2.72.1@sha256:d39a229ebd8250fea62f44c377ddb04797e8a155140eda49db17f1caaa9334ff
    working_dir: /api
    volumes:
      - ./api:/api:ro
    command: ["lint", "openapi.yaml"]

volumes:
  data:
  go-build-cache:
  go-mod-cache:
