services:
  api:
    ports: !override
      - "18090:8080"
    environment:
      SEED_ACCOUNTS: large_account:10737418240,small_account:104857600
      ENV_CONFIG_URL: http://env-stub/dev
    depends_on:
      - env-stub

  env-stub:
    image: nginx:1.30-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    volumes:
      - ./e2e/testdata/env.json:/usr/share/nginx/html/dev:ro
